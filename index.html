<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leoyu</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="public/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="public/favicon/favicon.svg" />
    <link rel="shortcut icon" href="public/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="public/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="public/favicon/site.webmanifest" />
</head>

<body>

    <!-- Preload Phase -->

    <div class="preloader-overlay" id="preloader">
        <div class="preloader-content">
            <div class="preloader-spinner"></div>
            <p class="preloader-text">Hold on . . .</p>
        </div>
    </div>

    <!-- MousePoint -->

    <div class="ambient-glow" aria-hidden="true"></div>
    <div class="mouse-bear" aria-hidden="true">
        <span class="mouse-f idle">
            <img src="public/svg/bear.svg" aria-hidden="true" width="65px" height="65px">
        </span>
    </div>

    <!-- Star BG -->

    <div class="stars-cont" aria-hidden="true">
        <div class="stars-layer stars-distant"></div>
        <div class="stars-layer stars-small"></div>
        <div class="stars-layer stars-bright"></div>
    </div>

    <main class="dashboard-layout">

        <aside class="left-sidebar">

            <!-- Banner + Pfp -->

            <div class="card profile-header-card">
                <div class="profile-identity">
                    <div class="avatar-container">
                        <img src="public/pfp+banner/pfp7.jpg" alt="Profile avatar" class="avatar-img">
                        <div class="avatar-overlay"></div>
                        <div class="thought-bubble">
                            <span>yeesh . . . </span>
                        </div>
                    </div>
                    <div class="user-meta">
                        <h1 class="user-name">Leoyu</h1>
                        <span class="user-handle" title="Copy user">@ayoyuta</span>
                        <img src="public/svg/discord-icon-1.webp" alt="discord">
                    </div>
                </div>
                <div class="banner-container">
                    <img src="public/pfp+banner/banner1.jpg" alt="Profile banner" class="banner-img">
                    <div class="banner-overlay"></div>
                </div>

                <time class="profile-date" id="profile-date">Oct 27</time>
                <button class="persona-switch-btn" id="persona-switch-btn" title="switch" aria-label="switch profile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m16 3 4 4-4 4" />
                        <path d="M20 7H4" />
                        <path d="m8 21-4-4 4-4" />
                        <path d="M4 17h16" />
                    </svg>
                </button>
            </div>

            <!-- Bio -->

            <div class="bio-grid">
                <div class="card bio-card">
                    <span class="card-tag bio-tag">BIO<span class="e-tag">:</span></span>
                    <P>"Can <span class="calling-trigger" data-img="public/status/distant-m1.jpg"
                            data-title="Memory 01">you</span> see me?<br>
                        I'm waiting for the right <span class="calling-trigger" data-img="public/status/distant-m2.gif"
                            data-title="Memory 02">time</span><br>
                        I can't read you<br>
                        But if you want<br>
                        The pleasure's all <span class="calling-trigger" data-img="public/status/distant-m3.jpg"
                            data-title="Memory 03">mine</span>"
                    </P>
                </div>

                <div class="card more-info-card">
                    <span class="card-tag bio-tag">Status<span class="e-tag">:</span></span>
                    <div class="status-gallery" id="status-gallery">
                        <img class="status-slide active" src="public/status/status-2.jpg" alt="status">
                        <img class="status-slide" src="public/status/status-3.jpg" alt="status 2">
                        <img class="status-slide" src="public/status/status-4.jpg" alt="status 3">
                        <img class="status-slide" src="public/status/status-5.jpg" alt="status 4">
                        <img class="status-slide" src="public/status/status-6.jpg" alt="status 5">
                    </div>
                </div>
            </div>

            <!-- Embed Playing-->

            <div class="card now-playing-card">
                <div class="now-playing-label">
                    <span class="status-pulse" id="status-dot">
                    </span>
                    <span id="status-text">now playing</span>
                    <span class="status-eq" id="status-eq">
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                    </span>

                </div>
                <div class="embed-player-wrapper" id="player-container">
                    <div class="player-resting">
                        <span class="resting-icon">💤</span>
                        <p class="resting-text">resting . . .</p>
                    </div>
                </div>
            </div>
        </aside>

        <section class="content-stream">

            <!-- Card 1: Artists I Like-->

            <article class="card topic-card">
                <header class="card-header">
                    <span class="card-tag">-</span>
                    <h2 class="card-title">-</h2>
                </header>
                <div class="card-body">
                    <p>-</p>
                </div>
            </article>

            <!-- Card 2: Favorite Genres -->

            <article class="card topic-card">
                <header class="card-header">
                    <span class="card-tag">-</span>
                    <h2 class="card-title">-</h2>
                </header>
                <div class="card-body">
                    <p>-</p>
                </div>
            </article>

            <!-- Card 3: Favorite Tracks -->

            <article class="card topic-card">
                <header class="card-header">
                    <span class="card-tag">-</span>
                    <h2 class="card-title">-</h2>
                </header>
                <div class="card-body">
                    <P>-</P>
                </div>
            </article>
        </section>
    </main>

    <button class="music-icon" title="Click to play • Double-click for the song" aria-label="Toggle background music">

        <svg class="icon-playing" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-audio-lines preview-icon">
            <path d="M2 10v3" />
            <path d="M6 6v11" />
            <path d="M10 3v18" />
            <path d="M14 8v7" />
            <path d="M18 5v13" />
            <path d="M22 10v3" />
        </svg>

        <svg class="icon-muted" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-audio-lines-off preview-icon">
            <path d="M10 10v11" />
            <path d="M10 3v1.35" />
            <path d="M14 14v1" />
            <path d="M14 8v.35" />
            <path d="M18 5v7.35" />
            <path d="M2 10v3" />
            <path d="m2 2 20 20" />
            <path d="M22 10v3" />
            <path d="M6 6v11" />
        </svg>
    </button>
    <audio id="bg-audio" src="public/bg-music/bg-music1(Kiss Me Again).mp3" loop preload="auto"></audio>

    <!-- Toasts/Pop ups/SFX -->

    <div class="toast-container" id="toast-container"></div>
    <div class="screen-overlay" id="screen-g">
        <h1 class="screen-p-text" id="screen-p-text">S o m e t h i n g</h1>
    </div>
    <audio id="switch-sfx" src="public/bg-music/switch.m4a" preload="auto"></audio>


    <aside class="calling-card" id="calling-card" aria-hidden="true">
        <div class="calling-card-inner">
            <img src="" alt="Distant memory" class="calling-card-img" id="calling-img">
        </div>
    </aside>




    <script src="index.js"></script>
</body>

</html>
